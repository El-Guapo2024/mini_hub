name: PR

# The merge gate -- started by hand, like everything else here.
#
# This one is Linux and cheap, but it ran on every push and every pull
# request, and the point of going manual was to stop runners starting on
# their own at all. Nothing is checked less; it is checked when asked:
#
#     gh workflow run PR --ref main
#
# The trade is real and worth knowing: a broken commit now reaches main
# without anything objecting. Run this before shipping, because TestFlight
# no longer runs the gate for you either.
on:
  workflow_dispatch:

concurrency:
  # A second push to the same branch cancels the first: the older answer is
  # about code nobody is going to merge.
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the channel rather than a version so the toolchain does
          # not move under us on a Tuesday. Bump deliberately.
          channel: stable
          cache: true

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: assets/chinese/asr
          key: asr-${{ hashFiles('tool/fetch_asr_model.sh') }}

      - name: Fetch the speech model
        # ~170MB and gitignored, but pubspec lists its folder as an asset, so
        # tests and builds fail without it. Cached, so this is usually a no-op.
        run: tool/fetch_asr_model.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # Formatting is mechanical, so it is worth failing on rather than
        # arguing about in review. --set-exit-if-changed reports rather than
        # rewrites.
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Warnings included: the analyzer has caught a shipped YAML break and
        # an unused import in this repo already.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        # The everyday suite: ~181 tests in about half a minute.
        run: flutter test --reporter expanded

      - name: Test (slow)
        # The whole-bank rendering checks, tagged slow so they stay out of the
        # local loop. On CI there is no reason to skip them — a question that
        # renders as "Parser Error" for a student is exactly what they catch.
        run: flutter test --run-skipped --tags slow --reporter expanded

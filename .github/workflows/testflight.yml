name: TestFlight

# A signed build, uploaded to App Store Connect, where it appears in TestFlight.
#
# Every merge to main becomes a TestFlight build. Nothing here runs on a pull
# request: a PR must not be able to ship.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Uploads must not race: two jobs in flight can both claim the same build
  # number and the second is rejected. Queued, not cancelled — a merge that
  # was already building should still reach testers.
  group: testflight
  cancel-in-progress: false

jobs:
  bridge:
    # Anki's core for iOS: reused when already published, built otherwise.
    uses: ./.github/workflows/anki_bridge.yml
    permissions:
      contents: write

  ship:
    name: build and upload
    needs: bridge
    # A macOS runner is not optional: only Xcode can archive an iOS app.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        # Apple rejects an upload built against an SDK it considers old, and
        # says so only at the very end:
        #
        #   This app was built with the iOS 17.5 SDK. All iOS and iPadOS apps
        #   must be built with the iOS 26 SDK or later.
        #
        # A runner image can carry several Xcodes and the default is not always
        # the newest, so pick it rather than inherit it, and print the version
        # -- when Apple next raises the floor, this line is the evidence.
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iphoneos' || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: assets/chinese/asr
          key: asr-${{ hashFiles('tool/fetch_asr_model.sh') }}

      - name: Fetch the speech model
        # ~170MB and gitignored; the mic's recognizer ships inside the app.
        run: tool/fetch_asr_model.sh

      - name: Fetch Anki's core
        # Published by the bridge job this one needs; downloaded, not
        # compiled, so a merge doesn't pay for a Rust build.
        env:
          GH_TOKEN: ${{ github.token }}
        run: tool/fetch_anki_bridge.sh

      - name: Install dependencies
        run: flutter pub get

      # The gate runs again here rather than trusting that the PR checks ran.
      # A direct push to main skips pull request checks entirely, and this is
      # the job that puts code on someone's phone.
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

      - name: Check the release settings are real
        # Fails early and says why, rather than after a twenty-minute archive
        # that App Store Connect then rejects.
        run: |
          set -euo pipefail
          bundle_id=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER = ' ios/Runner.xcodeproj/project.pbxproj \
            | sed 's/.*= //; s/;//')
          echo "bundle identifier: $bundle_id"
          echo "BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"
          if [[ "$bundle_id" == com.example.* ]]; then
            echo "::error::The bundle identifier is still $bundle_id. App Store" \
                 "Connect will not accept com.example.*; set a real reverse-domain" \
                 "id you own in ios/Runner.xcodeproj and register it in App Store Connect."
            exit 1
          fi

      - name: Set the build number
        # App Store Connect refuses a build number it has already seen, and
        # pubspec ships +1 forever. The run number only ever goes up, which is
        # the one property the store cares about. The marketing version in
        # pubspec is left alone — that is a human decision.
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "shipping $version+${{ github.run_number }}"
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_DIST_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # A keychain of its own, unlocked for this job only. The runner is
          # thrown away afterwards, but a build should not leave a signing
          # identity sitting in the default keychain even so.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops for a UI prompt no one can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/dist.p12"

      - name: Place the App Store Connect API key
        # Used twice: Xcode signs with it below, altool uploads with it later.
        # Written once, in the directory altool insists on, under the name it
        # insists on.
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$API_PRIVATE_KEY" | base64 --decode > ~/private_keys/AuthKey_$API_KEY_ID.p8

      - name: Install the provisioning profile
        # Made through the App Store Connect API rather than committed as a
        # secret, so there is no profile sitting in a repository quietly
        # expiring. See tools/ci/provisioning_profile.py for why this is not
        # left to Xcode's automatic signing.
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          pip3 install --quiet --break-system-packages pyjwt cryptography
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          name=$(python3 tools/ci/provisioning_profile.py)
          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"

      - name: Archive
        # Unsigned, and signed on export instead. `flutter build ipa` has no
        # way to pass flags through to xcodebuild -- it reads the first thing
        # after `--` as a Dart entrypoint and fails with "Target file not
        # found" -- and the flags Xcode needs in order to fetch a provisioning
        # profile can only be given to xcodebuild. So the two halves are split
        # and the signing happens in the half that can be told how.
        run: |
          set -euo pipefail
          flutter build ipa --release --no-codesign \
            --build-name "$FLUTTER_VERSION" \
            --build-number "${{ github.run_number }}"

      - name: Sign and export the IPA
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Manual signing, with the certificate imported above and the profile
          # installed above. Automatic signing cannot be used at all here:
          # Xcode's version of it wants a cloud-managed distribution
          # certificate, and an App Store Connect API key is not permitted to
          # use one -- it fails with "Cloud signing permission error", and then
          # with "No profiles were found" as a consequence of that.
          #
          # Manual here does not mean anyone does anything by hand. Both halves
          # were made through the API and neither is committed.
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          archive=$(find build/ios/archive -maxdepth 1 -name '*.xcarchive' -print -quit)
          echo "exporting $archive"

          xcrun xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          # The key is already in ~/private_keys, where signing put it.
          ipa=$(find build/ios/ipa -name '*.ipa' -print -quit)
          echo "uploading $ipa"

          # Validated first: a rejection here costs a minute, the same
          # rejection after upload costs a build number and a round trip.
          xcrun altool --validate-app -f "$ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

      - name: Release it to the testers
        # Uploading is not releasing. A build that finishes processing sits in
        # App Store Connect visible to nobody until it is attached to a group,
        # so without this every merge would reach Apple and no iPad.
        #
        # It waits for Apple to finish processing, which is why this step takes
        # minutes while the ones around it take seconds.
        #
        # Both groups, not just the internal one. External testers are attached
        # to the same build here rather than by hand; the build stays invisible
        # to them until Apple's beta review passes it, which is Apple's timing
        # and not something this step waits on.
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_APP_ID: '6804838723'
          BUILD_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          python3 tools/ci/release_to_testers.py

      - name: Shred the key
        # always(), because a failed build is exactly when the key is left
        # lying around. The runner is destroyed either way; this is so that
        # being wrong about that is not interesting.
        if: always()
        run: rm -rf ~/private_keys

      - name: Keep the IPA and symbols
        # Attached to the run regardless of whether the upload landed, so a
        # rejected build can be looked at rather than rebuilt blind.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-${{ github.run_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30

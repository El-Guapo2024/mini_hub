[package]
name = "mini_hub_bridge"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
# staticlib is what the iOS app links; lib lets host tests call it.
crate-type = ["staticlib", "lib"]

[dependencies]
anki = { path = "../rslib", features = ["rustls"] }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
